# Codziennie usuwa z bazy Firebase pokoje gry online bez ruchu od ponad 7 dni.
# Wymaga sekretu FIREBASE_SERVICE_ACCOUNT (zobacz README).
name: Sprzątanie pokojów gry online

on:
  schedule:
    - cron: '17 3 * * *' # codziennie ok. 3:17 UTC
  workflow_dispatch: # ręczne uruchomienie z zakładki Actions

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Usuń stare pokoje
        run: node tools/cleanup-rooms.mjs
        env:
          FIREBASE_DB_URL: https://mlynek-57b4f-default-rtdb.europe-west1.firebasedatabase.app
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ROOM_TTL_DAYS: 7
